[package]
name = "ccht-python"
version = "0.2.9"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "Python bindings for the ccht conversation model"
repository = "https://github.com/corbet-foss/ccht"
publish = false
readme = "README.md"

[lib]
name = "_native"
crate-type = ["cdylib"]

# Keep Python's build dependencies outside the public Rust/Wasm workspace.
[workspace]
resolver = "3"

[dependencies]
ccht = { version = "=0.2.9", default-features = false }
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "extension-module"] }
