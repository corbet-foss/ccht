[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "ccht"
version = "0.2.8"
description = "The shared Rust conversation model for Python chat applications"
readme = "README.md"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
license-files = ["LICENSES/**/*"]
requires-python = ">=3.10"
keywords = ["chat", "acp", "conversation", "streaming"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/corbet-foss/ccht#readme"
Repository = "https://github.com/corbet-foss/ccht"
Issues = "https://github.com/corbet-foss/ccht/issues"

[tool.maturin]
bindings = "pyo3"
module-name = "ccht._native"
python-source = "."
compatibility = "pypi"
auditwheel = "repair"
locked = true
strip = true
include = [
  { path = "vendor/**/*", format = "sdist" },
  { path = ".cargo/config.toml", format = "sdist" },
  { path = "Cargo.lock", format = "sdist" },
  { path = "THIRD-PARTY.md", format = "sdist" },
]
