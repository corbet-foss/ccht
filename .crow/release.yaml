# Reconcile or publish prepared packages without compilation.
name: release
when:
  - event: manual
    branch: main
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  CI_TOOL_ARCHIVE: {default: ""}
  CI_TOOL_SHA256: {default: ""}
  CI_TOOL_BINARY: {default: ""}
  CI_TOOL_BINARY_SHA256: {default: ""}
  CI_JOBS: {default: "2"}
  CI_TEST_THREADS: {default: "2"}
  CI_MEMORY_MB: {default: ""}
  CI_MEMORY_PER_JOB_MB: {default: ""}
  CI_MIN_AVAILABLE_MB: {default: "8192"}
  CI_REPOSITORY_URL: {default: ""}
  CI_TIMEOUT: {default: "900"}
  CI_CACHE_ROOT: {default: ""}
  CARGO_TARGET_DIR: {default: ""}
  CI_NIX_JOBS: {default: ""}
  CI_LINKER: {default: system}
  TMPDIR: {default: ""}
  RELEASE_BUNDLE: {default: ""}
  RELEASE_BUNDLE_SHA256: {default: ""}
  RELEASE_CHANNELS: {default: all, options: [all, cargo, npm, jsr, pypi]}
  RELEASE_OPERATION: {default: status, options: [inspect, status, publish]}
  RELEASE_JOURNAL_ROOT: {default: ""}

steps:
  # Crow resolves secrets while compiling selected steps, before shell commands.
  # Keep this step unconditional so invalid selectors fail instead of doing no work.
  - name: validate-release-selection
    image: bash
    environment: &publisher-environment
      CCID_REVISION: '3175c51005006f6050033a55b3da033333ecf84d'
    commands:
      - |
        set -eu
        case "$RELEASE_OPERATION" in
          inspect|status|publish) ;;
          *) printf '%s\n' 'RELEASE_OPERATION must be inspect, status, or publish' >&2; exit 2 ;;
        esac
        case "$RELEASE_CHANNELS" in
          all|cargo|npm|jsr|pypi) ;;
          *) printf '%s\n' 'RELEASE_CHANNELS must be all, cargo, npm, jsr, or pypi' >&2; exit 2 ;;
        esac
        if [ "$RELEASE_OPERATION" = publish ] && [ "$RELEASE_CHANNELS" = all ]; then
          printf '%s\n' 'Publish one registry per run: set RELEASE_CHANNELS to cargo, npm, jsr, or pypi' >&2
          exit 2
        fi
  - name: inspect-prepared-packages
    image: bash
    depends_on: [validate-release-selection]
    when:
      - evaluate: 'RELEASE_OPERATION == "inspect" && RELEASE_CHANNELS in ["all", "cargo", "npm", "jsr", "pypi"]'
    environment: *publisher-environment
    commands: &publisher-commands
      - |
        set -eu
        printf '%s  %s\n' "$CI_TOOL_SHA256" "$CI_TOOL_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$CI_TOOL_ARCHIVE")" = "$CCID_REVISION"
        test -n "$CI_TOOL_BINARY"
        test -n "$CI_TOOL_BINARY_SHA256"
        printf '%s  %s\n' "$CI_TOOL_BINARY_SHA256" "$CI_TOOL_BINARY" | sha256sum --check --strict
        test "$("$CI_TOOL_BINARY" source-revision)" = "$CCID_REVISION"
        TMPDIR="$${TMPDIR:-/tmp}"
        export TMPDIR
        exec "$CI_TOOL_BINARY" check --archive "$SOURCE_ARCHIVE" --sha256 "$SOURCE_SHA256" --commit "$CI_COMMIT_SHA" --check release
  - name: release-status
    image: bash
    depends_on: [validate-release-selection]
    when:
      - evaluate: 'RELEASE_OPERATION == "status" && RELEASE_CHANNELS in ["all", "cargo", "npm", "jsr", "pypi"]'
    environment:
      <<: *publisher-environment
      GH_TOKEN: {from_secret: ccht_release_github_token}
    commands: *publisher-commands
  - name: publish-cargo
    image: bash
    depends_on: [validate-release-selection]
    when:
      - evaluate: 'RELEASE_OPERATION == "publish" && RELEASE_CHANNELS == "cargo"'
    environment:
      <<: *publisher-environment
      GH_TOKEN: {from_secret: ccht_release_github_token}
      RELEASE_CARGO_AUTH: token
      CARGO_REGISTRY_TOKEN: {from_secret: ccht_release_cargo_token}
    commands: *publisher-commands
  - name: publish-npm
    image: bash
    depends_on: [validate-release-selection]
    when:
      - evaluate: 'RELEASE_OPERATION == "publish" && RELEASE_CHANNELS == "npm"'
    environment:
      <<: *publisher-environment
      GH_TOKEN: {from_secret: ccht_release_github_token}
      NPM_TOKEN: {from_secret: ccht_release_npm_token}
    commands: *publisher-commands
  - name: publish-jsr
    image: bash
    depends_on: [validate-release-selection]
    when:
      - evaluate: 'RELEASE_OPERATION == "publish" && RELEASE_CHANNELS == "jsr"'
    environment:
      <<: *publisher-environment
      GH_TOKEN: {from_secret: ccht_release_github_token}
      JSR_TOKEN: {from_secret: ccht_release_jsr_token}
    commands: *publisher-commands
  - name: publish-pypi
    image: bash
    depends_on: [validate-release-selection]
    when:
      - evaluate: 'RELEASE_OPERATION == "publish" && RELEASE_CHANNELS == "pypi"'
    environment:
      <<: *publisher-environment
      GH_TOKEN: {from_secret: ccht_release_github_token}
      PYPI_TOKEN: {from_secret: ccht_release_pypi_token}
    commands: *publisher-commands
